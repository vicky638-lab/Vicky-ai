<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vicky AI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#fff;--soft:#f4f5f8;--line:#e7e8ee;--text:#16181f;--mute:#6c7080;--ac:#5b4df0;--fs:16px;--ff:'Noto Serif Tamil',Georgia,serif}
html.dark{--bg:#121318;--soft:#1d1f27;--line:#2a2d38;--text:#ececf1;--mute:#9a9eb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ff);font-size:var(--fs)}
button{font:inherit;color:inherit;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;margin:0 auto;max-width:860px}
html.wide #app{max-width:1200px}
header{display:flex;align-items:center;padding:8px 10px}
header .ttl{flex:1;text-align:center;font-weight:600}
.ib{display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:0;padding:9px;border-radius:12px;color:var(--mute)}
.ib:active{background:var(--soft)}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 14px}
#welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px 0 60px;animation:up .5s}
#welcome h1{font-size:2em;margin:0 0 6px;font-weight:600}
#welcome p{margin:0;font-size:1.25em;color:var(--mute)}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}
.sug{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 15px;font-size:.88em}
#chat{display:none;padding-bottom:10px}
.msg{margin:16px 0;animation:up .25s;-webkit-user-select:none;user-select:none}
.msg.user{display:flex;justify-content:flex-end}
.ubub{background:var(--soft);padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:86%;white-space:pre-wrap;overflow-wrap:anywhere}
.thumb{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-top:8px}
.abody{line-height:1.75;overflow-wrap:anywhere}
.abody p{margin:0 0 .7em}.abody p:last-child{margin:0}
.abody pre{overflow:auto;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:12px;font-size:.82em}
.abody code{background:var(--soft);padding:1px 5px;border-radius:5px}
.abody pre code{background:none;padding:0}
.abody img.gen,.abody video{display:block;max-width:100%;border-radius:14px}
.acts{display:flex;gap:2px;margin-top:2px}
.acts .ib{padding:7px}.acts .ib.on{color:var(--ac)}
.dots span{display:inline-block;width:8px;height:8px;margin:3px;border-radius:50%;background:var(--ac);animation:bn 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
footer{padding:6px 12px calc(10px + env(safe-area-inset-bottom,0px))}
#preview{display:none;gap:10px;padding:4px 4px 8px;overflow-x:auto}
#preview .pv{position:relative;flex:none}
#preview img{height:56px;border-radius:10px;display:block}
#preview .pv button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:13px;line-height:20px;padding:0}
#modeTag{display:none;font-size:.8em;color:var(--ac);padding:0 8px 6px}
.box{border:1.5px solid var(--line);border-radius:26px;padding:8px 10px 6px;background:var(--bg)}
.box:focus-within{border-color:var(--ac)}
#input{width:100%;border:0;outline:0;resize:none;background:transparent;line-height:1.5;max-height:160px;padding:4px 6px}
.row{display:flex;align-items:center;gap:2px}
.row .sp{flex:1}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center}
.send:disabled{opacity:.5}
.orbBtn{width:34px;height:34px;border-radius:50%;border:0;margin:0 6px;background:radial-gradient(circle at 30% 30%,#fff9,transparent 40%),linear-gradient(135deg,var(--ac),#c084fc);box-shadow:inset -3px -4px 8px #0003,0 2px 8px #0003}
.pop{position:fixed;z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px #0002;padding:6px;display:none;min-width:220px}
.pop button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:11px 12px;border-radius:10px;text-align:left}
.pop button:active{background:var(--soft)}
#scrim{position:fixed;inset:0;background:#0006;display:none;z-index:20}
#drawer{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:86%;background:var(--bg);z-index:21;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
#drawer.open{transform:none}
.dh{font-size:1.25em;font-weight:600;padding:6px 8px 10px}
.sec{font-size:.72em;letter-spacing:.06em;color:var(--mute);margin:14px 8px 4px}
.it{display:flex;align-items:center;gap:4px;border-radius:10px}
.it:active{background:var(--soft)}
.it .lab{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:10px 8px}
.it .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:.68em;background:var(--soft);color:var(--mute);border-radius:8px;padding:2px 7px;margin-left:auto}
.prof{display:flex;align-items:center;gap:10px;margin-top:auto;border:0;background:var(--soft);border-radius:14px;padding:10px;text-align:left}
.ava{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #0003;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));display:none;max-height:85vh;overflow-y:auto}
.sheet h3{margin:6px 6px 10px}
.sheet button.o{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 10px;border-radius:12px;text-align:left}
.sheet button.o:active{background:var(--soft)}
.set label{display:block;font-size:.8em;color:var(--mute);margin:14px 6px 6px}
.set select,.set input[type=text],.set input[type=password]{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.set input[type=range]{width:100%}
.sw{display:flex;gap:10px;padding:0 6px;flex-wrap:wrap}
.sw span{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw span.on{border-color:var(--text)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--ac);color:#fff}
.btn.g{background:var(--soft);color:var(--text)}
#vpage textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:10px;background:var(--bg);resize:none}
#live{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:20px}
#orb{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fffc,transparent 38%),linear-gradient(135deg,var(--ac),#c084fc);box-shadow:inset -14px -18px 34px #0004,0 18px 50px #5b4df066}
#orb.listen{animation:pulse 1.6s ease-in-out infinite}
#orb.think{animation:spin 1.4s linear infinite;border-radius:42% 58% 55% 45%}
#orb.speak{animation:talk .55s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{25%{transform:scale(1.1,.93)}75%{transform:scale(.93,1.1)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="menuBtn" data-ic="menu" aria-label="Menu"></button>
    <div class="ttl" id="ttl">Vicky AI</div>
    <button class="ib" id="newBtn" data-ic="edit" aria-label="New chat"></button>
  </header>
  <main id="main">
    <section id="welcome">
      <h1>Hello! I am Vicky AI</h1>
      <p>How can I help you?</p>
      <div class="sugs" id="sugs"></div>
    </section>
    <section id="chat"></section>
    <section id="vpage" style="display:none;padding:14px 0">
      <h2 style="margin:0 0 4px">Video generator</h2>
      <p style="margin:0 0 12px;color:var(--mute);font-size:.9em">வீடியோவை விவரியுங்கள். இது உங்கள் Puter credits-ஐப் பயன்படுத்தும். Sample mode இலவசம்.</p>
      <textarea id="vPrompt" rows="4" placeholder="A fox running through snow at sunset..."></textarea>
      <select id="vModel" style="width:100%;margin:10px 0;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)">
        <option value="google/veo-3.1-lite">Veo 3.1 Lite (cheapest)</option>
        <option value="google/veo-3.1-fast">Veo 3.1 Fast</option>
        <option value="openai/sora-2">Sora 2</option>
      </select>
      <label style="display:block;margin:6px 0 12px"><input type="checkbox" id="vTest"> Sample mode (free, not a real video)</label>
      <button class="btn" id="vGo">Generate video</button>
      <div id="vOut" style="margin-top:16px"></div>
    </section>
  </main>
  <footer>
    <div id="preview"></div>
    <div id="modeTag"></div>
    <div class="box">
      <textarea id="input" rows="1" placeholder="Ask anything"></textarea>
      <div class="row">
        <button class="ib" id="plusBtn" data-ic="plus" aria-label="Add"></button>
        <span class="sp"></span>
        <button class="ib" id="micBtn" data-ic="mic" aria-label="Voice to text"></button>
        <button class="orbBtn" id="liveBtn" aria-label="Live voice"></button>
        <button class="send" id="sendBtn" data-ic="send" data-sz="20" aria-label="Send"></button>
      </div>
    </div>
  </footer>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dh">Vicky AI</div>
  <div class="sec">CREATE</div>
  <div id="tools"></div>
  <div class="sec">CHATS</div>
  <div id="chatList"></div>
  <div style="height:16px"></div>
  <button class="prof" id="profBtn"><span class="ava" id="ava">V</span><span><b id="pname">Guest</b><br><small style="color:var(--mute)">Settings</small></span></button>
</aside>
<div class="pop" id="plusPop"></div>
<div class="sheet" id="sheet"></div>
<div id="live"><div id="orb"></div><div id="liveTxt" style="font-size:1.1em;color:var(--mute);min-height:3em"></div><button class="btn g" id="liveEnd">Close</button></div>
<script src="app.js?v=1"></script>
</body>
</html>
